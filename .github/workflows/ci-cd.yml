name: CI/CD Pipeline (Docker + ArgoCD)

on:
  push:
    branches: [ main, Master ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Extract the new tag automatically from deployment.yaml
      - name: Extract image tag
        id: vars
        run: |
          TAG=$(grep 'image:' deployment.yaml | awk -F ':' '{print $3}')
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "Detected TAG: $TAG"

      # 3️⃣ Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4️⃣ Build and push Docker image
      - name: Build and push Docker image to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            smitdarji/k8s:latest
            smitdarji/k8s:${{ env.TAG }}

      # 5️⃣ Update deployment.yaml with new image tag and push changes
      - name: Update deployment.yaml with new image tag
        run: |
          echo "🧩 Updating deployment.yaml..."
          sed -i "s|image: .*|image: smitdarji/k8s:${{ env.TAG }}|g" deployment.yaml
          cat deployment.yaml

          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add deployment.yaml
          git commit -m "Auto-update image to ${{ env.TAG }}" || echo "No changes to commit"
          git push
