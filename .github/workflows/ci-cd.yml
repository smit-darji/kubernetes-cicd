name: CI/CD Pipeline

on:
  push:
    branches: [ main, Master ]
  pull_request:
    branches: [ main, Master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Login to GitHub Container Registry
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.git_password }}  # Create in GitHub → Settings → Secrets → Actions

      # 3️⃣ Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      # 4️⃣ Update deployment.yaml in the same repo (ArgoCD watches this)
      - name: Update deployment.yaml with new image tag
        run: |
          echo "🧩 Updating image tag in deployment.yaml..."
          cat deployment.yaml
          # Update image reference
          sed -i "s|image: ghcr.io/.*/.*:.*|image: ghcr.io/${{ github.repository }}:${{ github.sha }}|g" deployment.yaml

          cat deployment.yaml
          # Commit & push changes (same repo)
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add deployment.yaml
          git commit -m "Update image to ${{ github.sha }}" || echo "No changes to commit"
          git push
