name: CI/CD Pipeline

on:
  push:
    branches: [ main, Master ]
  pull_request:
    branches: [ main, Master ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3️⃣ Build and push Docker image
      - name: Build and push Docker image to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            smitdarji/k8s:latest
            smitdarji/k8s:v0.0.19

      # 4️⃣ Update deployment.yaml (for ArgoCD)
      - name: Update deployment.yaml with new image tag
        run: |
          echo "🧩 Updating image tag in deployment.yaml..."
          sed -i "s|image: .*|image: smitdarji/k8s:v0.0.19|g" deployment.yaml
          cat deployment.yaml

          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add deployment.yaml
          git commit -m "Update image to v0.0.19" || echo "No changes to commit"
          git push
